<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071a45;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d2d6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a8f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1440" height="680" fill="url(#bg)"/>
  <!-- Abstract dollar sign shapes -->
  <circle cx="900" cy="340" r="280" fill="url(#glow)" opacity="0.6"/>
  <circle cx="1100" cy="200" r="160" fill="#1565c0" opacity="0.08"/>
  <circle cx="1200" cy="480" r="200" fill="#1565c0" opacity="0.06"/>
  <!-- Decorative lines suggesting growth chart -->
  <polyline points="700,500 820,380 900,420 1020,280 1140,310 1280,200" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <polyline points="700,540 820,440 900,470 1020,340 1140,360 1280,250" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <!-- Dollar signs scattered -->
  <text x="820" y="200" font-size="120" font-family="Georgia,serif" fill="rgba(255,255,255,0.04)" font-weight="700">$</text>
  <text x="1050" y="420" font-size="80" font-family="Georgia,serif" fill="rgba(255,255,255,0.03)" font-weight="700">$</text>
  <text x="1250" y="300" font-size="60" font-family="Georgia,serif" fill="rgba(255,255,255,0.05)" font-weight="700">$</text>
</svg>
